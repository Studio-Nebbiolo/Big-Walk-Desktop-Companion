# Windows에서 exe를 빌드해 GitHub Releases에 올린다.
# - 버전 태그(v*)를 푸시하거나
# - Actions 탭에서 수동 실행(workflow_dispatch)하면 package.json 의 version 으로 v<버전> 태그와 릴리스를 만든다.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Windows exe (portable + installer)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Big Walk Companion v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/BigWalkCompanion-*-portable.exe
            dist/BigWalkCompanion-*-setup.exe
          generate_release_notes: true
