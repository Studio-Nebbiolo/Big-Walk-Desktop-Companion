# 버전 태그(v*)를 올리면 Windows에서 exe를 빌드해 GitHub Releases에 올린다.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Windows exe (portable + installer)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BigWalkCompanion-*-portable.exe
            dist/BigWalkCompanion-*-setup.exe
          generate_release_notes: true

      - name: Keep exe as workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: BigWalkCompanion-windows
          path: |
            dist/BigWalkCompanion-*-portable.exe
            dist/BigWalkCompanion-*-setup.exe
