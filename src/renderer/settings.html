<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Big Walk Companion</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!-- 홈: 메뉴 -->
  <section id="view-home" class="view home">
    <header class="home-head">
      <canvas id="home-stage" class="home-stage" aria-hidden="true"></canvas>
      <h1 class="logo">Big Walk<br /><span>Companion</span></h1>
    </header>

    <div class="collect card">
      <canvas id="collect-icon" class="collect-icon" aria-hidden="true"></canvas>
      <div>
        <div class="collect-label">모은 오뚜기</div>
        <div class="collect-num"><span id="collect-count">0</span><small>개</small></div>
      </div>
    </div>

    <nav class="menu">
      <button class="menu-btn yellow" data-go="custom"><span class="ico">🎨</span>캐릭터 커스터마이징</button>
      <button class="menu-btn teal" data-go="hotkey"><span class="ico">⌨️</span>단축키 설정</button>
      <button class="menu-btn red" id="quit-open"><span class="ico">🚪</span>나가기</button>
    </nav>
  </section>

  <!-- 캐릭터 커스터마이징 -->
  <section id="view-custom" class="view custom" hidden>
    <div class="topbar">
      <button class="back" data-go="home">← 메뉴</button>
      <h2>캐릭터 커스터마이징</h2>
    </div>
    <div class="custom-body">
      <aside class="sidebar card">
        <ul id="char-list" class="char-list"></ul>
        <button id="add-char" class="btn yellow">＋ 새 친구</button>
        <button id="import-open" class="btn">🔗 코드로 친구 추가</button>
        <div id="import-box" class="import-box" hidden>
          <input id="import-code" type="text" placeholder="BW1-..." spellcheck="false" autocomplete="off" />
          <button id="import-paste" class="btn small">📋 붙여넣기</button>
          <div class="row tight">
            <button id="import-cancel" class="btn small">취소</button>
            <button id="import-add" class="btn yellow small">추가</button>
          </div>
          <p id="import-msg" class="msg" role="status"></p>
        </div>
      </aside>

      <main class="editor">
        <section class="stage-wrap">
          <canvas id="preview" class="stage" title="클릭하면 점프해요"></canvas>
        </section>

        <section class="panel card" id="char-panel">
          <label class="field">
            <span>이름</span>
            <input id="char-name" type="text" maxlength="20" />
          </label>

          <div class="field">
            <span>공유 코드 · 친구에게 보내면 똑같은 친구를 데려갈 수 있어요</span>
            <div class="share-row">
              <input id="share-code" type="text" readonly spellcheck="false" />
              <button id="share-copy" class="btn teal">복사</button>
            </div>
          </div>

          <div class="tabs" id="part-tabs"></div>
          <div class="swatches" id="swatches"></div>

          <div class="row actions">
            <button id="randomize" class="btn">🎲 랜덤 색상</button>
            <span class="spacer"></span>
            <button id="remove-char" class="btn red">작별 인사하기</button>
          </div>
        </section>

        <section class="panel card global">
          <h3>모두에게 적용</h3>
          <div class="row">
            <label class="field grow">
              <span>걷는 속도 <output id="speed-out"></output></span>
              <input id="speed" type="range" min="0.3" max="3" step="0.1" />
            </label>
            <label class="field grow">
              <span>전체 크기 <output id="size-out"></output></span>
              <input id="size" type="range" min="0.6" max="1.8" step="0.05" />
            </label>
          </div>
          <div class="checks">
            <label class="check"><input id="greet" type="checkbox" /><i></i>마주치면 서로 인사하기</label>
            <label class="check"><input id="items" type="checkbox" /><i></i>바닥에 소품 생기기</label>
            <label class="check"><input id="daruma" type="checkbox" /><i></i>가끔 빨간 오뚜기 나타나기</label>
            <label class="check"><input id="shadows" type="checkbox" /><i></i>발밑 그림자</label>
            <label class="check"><input id="paused" type="checkbox" /><i></i>제자리에 멈추기</label>
            <label class="check"><input id="startup" type="checkbox" /><i></i>컴퓨터를 켤 때 같이 실행</label>
          </div>
        </section>
      </main>
    </div>
  </section>

  <!-- 단축키 설정 -->
  <section id="view-hotkey" class="view hotkey" hidden>
    <div class="topbar">
      <button class="back" data-go="home">← 메뉴</button>
      <h2>단축키 설정</h2>
    </div>
    <div class="card hotkey-card">
      <p class="lead">이 단축키를 누르면 친구들을 <b>바로 숨기고</b>, 한 번 더 누르면 다시 나타나요.<br />다른 창을 쓰고 있을 때도 동작해요.</p>
      <div id="hotkey-keys" class="keys" aria-live="polite"></div>
      <div class="row center">
        <button id="hotkey-change" class="btn yellow">바꾸기</button>
        <button id="hotkey-reset" class="btn">기본값 (Ctrl + Alt + H)</button>
        <button id="hotkey-clear" class="btn">끄기</button>
      </div>
      <p id="hotkey-msg" class="msg center" role="status"></p>
    </div>
  </section>

  <!-- 나가기 확인 -->
  <div id="quit-modal" class="modal" hidden>
    <div class="card modal-card">
      <canvas id="quit-face" class="quit-face" aria-hidden="true"></canvas>
      <p>친구들과 작별할까요?<br /><small>앱이 완전히 종료돼요.</small></p>
      <div class="row center">
        <button id="quit-cancel" class="btn">더 놀래요</button>
        <button id="quit-ok" class="btn red">나가기</button>
      </div>
    </div>
  </div>

  <script src="../shared/palette.js"></script>
  <script src="../shared/items.js"></script>
  <script src="../shared/character.js"></script>
  <script src="../shared/daruma.js"></script>
  <script src="../shared/sharecode.js"></script>
  <script src="settings.js"></script>
</body>
</html>
